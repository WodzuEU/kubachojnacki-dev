<!DOCTYPE html>
<html lang="en" data-order="0">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        /* the pages stand in a row: going on, the next one slides in from the
           right; going back, from the left (the row itself: js/site.js) */
        addEventListener('pagereveal', function (e) {
            if (!e.viewTransition) return;
            var me = +document.documentElement.dataset.order, dir, from;
            try { dir = sessionStorage.getItem('kch-dir'); from = +sessionStorage.getItem('kch-from'); sessionStorage.removeItem('kch-dir'); } catch (x) {}
            e.viewTransition.types.add(dir || (from > me ? 'back' : 'forward'));
        });
        addEventListener('pageswap', function () {
            try { sessionStorage.setItem('kch-from', document.documentElement.dataset.order); } catch (x) {}
        });
    </script>
    <title>Kuba Chojnacki | Paintings</title>
    <!-- links from the one-page site still land where they meant to -->
    <script>
        (function () {
            var h = decodeURIComponent(location.hash.slice(1));
            if (!h) return;
            var pages = { about: 'about/', contact: 'contact/', newsletter: 'contact/' };
            if (h === 'works') location.replace('collections/');
            else if (pages[h]) location.replace(pages[h]);
            else if (/^\d{2}-/.test(h)) location.replace('works/#' + h);
        })();
    </script>
    <meta name="description" content="Kuba Chojnacki is a painter working with color, gravity and diffusion. Abstract paintings on unprimed canvas, from a studio in Cracow.">
    <link rel="canonical" href="https://kubachojnacki.com/">
    <meta property="og:title" content="Kuba Chojnacki | Paintings">
    <meta property="og:description" content="Abstract paintings: color absorbed directly into unprimed canvas.">
    <meta property="og:image" content="https://kubachojnacki.com/IMAGES/works/03-atmosphere-maroon-khaki-hero.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kubachojnacki.com/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preload" href="fonts/eb-garamond-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
