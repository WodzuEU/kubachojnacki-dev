<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works | Kuba Chojnacki</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://kubachojnacki.com/atmosphere/">
    <script src="../js/data.js?v=20261015a"></script>
    <script>
        /* collections open straight into the first one: old links to /works/ and
           /collections/ go on to the right page. #chromatic -> /chromatic/,
           #<slug> -> its collection with the work open, anything else -> the
           first collection */
        (function () {
            var h = decodeURIComponent(location.hash.slice(1)), to = '../atmosphere/';
            var page = function (c) { return '../' + c.name.toLowerCase().replace(/\s+/g, '-') + '/'; };
            COLLECTIONS.forEach(function (c) {
                if (page(c) === '../' + h + '/') to = page(c);
                (c.works || []).forEach(function (w) { if (w.slug === h) to = page(c) + '#' + h; });
            });
            location.replace(to);
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=../atmosphere/"></noscript>
</head>
<body></body>
</html>
